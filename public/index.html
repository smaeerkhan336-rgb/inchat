<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>In Chat</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f5;--card:#fff;--tx:#14211c;--mu:#6b7a74;--pr:#0b8f6a;--me:#d6f5e7;--bd:#e0e6e3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101715;--card:#1a2420;--tx:#e8f0ec;--mu:#8fa39a;--pr:#2bc799;--me:#164a39;--bd:#2a3833}}
:root[data-theme=dark]{--bg:#101715;--card:#1a2420;--tx:#e8f0ec;--mu:#8fa39a;--pr:#2bc799;--me:#164a39;--bd:#2a3833}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
#app{max-width:520px;margin:auto;height:100%;display:flex;flex-direction:column}
header{background:var(--pr);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
header b{flex:1}header button{background:none;border:0;color:#fff;font-size:18px}
main{flex:1;overflow:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;width:100%;margin-top:6px}
.btn.s{width:auto;padding:6px 10px;margin:0}.btn.g{background:var(--card);color:var(--pr);border:1px solid var(--pr)}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;padding:10px 4px;border:0;background:none;color:var(--mu);font:inherit;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.av{width:42px;height:42px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.st{outline:3px solid var(--pr);outline-offset:2px}
.mu{color:var(--mu);font-size:12px}
.msgs{display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:7px 10px;border-radius:10px;background:var(--card);border:1px solid var(--bd);align-self:flex-start;word-break:break-word}
.m.me{background:var(--me);align-self:flex-end}.m img{max-width:100%;border-radius:8px;display:block}
.bar{display:flex;gap:6px;padding:8px;background:var(--card);border-top:1px solid var(--bd);align-items:center}
.bar input{margin:0;flex:1}.bar button{border:0;background:none;font-size:22px;color:var(--pr)}
.qr{background:#fff;padding:12px;display:inline-block;border-radius:8px}
.chips{display:flex;gap:6px;overflow:auto;padding:6px 8px}.chips span{white-space:nowrap;border:1px solid var(--pr);color:var(--pr);border-radius:16px;padding:3px 10px;font-size:13px}
.c{text-align:center}
</style></head><body><div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const A=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>esc((n||'?')[0].toUpperCase()),tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let T=localStorage.getItem('t'),me,sock,tab='chats',cur=null,hash=location.hash.slice(1),onMsg=null,onTyp=null;
async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.e||'गड़बड़ हुई');return j}
async function upload(file){const f=new FormData();f.append('f',file);const r=await fetch('/upload',{method:'POST',headers:{Authorization:'Bearer '+T},body:f});if(!r.ok)throw Error('अपलोड नहीं हुआ');return r.json()}
function shell(title,body,nav,back){A.innerHTML='';A.append($(`<header>${back?'<button id=bk>←</button>':''}<b>${esc(title)}</b></header>`));const m=$('<main></main>');m.append(body);A.append(m);
 if(back)A.querySelector('#bk').onclick=back;
 if(nav){const n=$(`<nav>${[['chats','💬 चैट'],['status','🟢 स्टेटस'],['shop',me.role=='shop'?'🏪 मेरी दुकान':'⭐ फॉलोइंग'],['me','👤 प्रोफ़ाइल']].map(([k,l])=>`<button data-k=${k} class="${tab==k?'on':''}">${l}</button>`).join('')}</nav>`);n.onclick=e=>{if(e.target.dataset.k){tab=e.target.dataset.k;home()}};A.append(n)}return m}
function auth(mode='login'){const s=mode=='signup';
 const f=$(`<div class=card><h3 style="margin:0 0 6px">In Chat ${s?'— रजिस्टर':'— लॉगिन'}</h3>${s?`<input id=n placeholder="नाम"><input id=g type=email placeholder="Gmail"><input id=p type=tel placeholder="मोबाइल नंबर"><input id=u placeholder="यूज़रनेम (a-z 0-9 -)">`:`<input id=u placeholder="यूज़रनेम / Gmail / नंबर">`}<input id=w type=password placeholder="पासवर्ड">${s?'<select id=r><option value=shop>मैं दुकानदार हूँ</option><option value=cust>मैं ग्राहक हूँ</option></select>':''}<button class=btn id=go>${s?'सेव करें':'खोलें'}</button><button class="btn g" id=sw>${s?'पहले से खाता है? लॉगिन':'नया खाता बनाएँ'}</button><div class=mu id=er style="color:#d33"></div></div>`);
 shell('In Chat',f);const v=i=>f.querySelector('#'+i)?.value.trim();
 f.querySelector('#sw').onclick=()=>auth(s?'login':'signup');
 f.querySelector('#go').onclick=async()=>{try{const r=s?await api('/signup','POST',{name:v('n'),gmail:v('g'),phone:v('p'),username:v('u').toLowerCase(),password:v('w'),role:v('r')}):await api('/login','POST',{id:v('u').toLowerCase(),password:v('w')});T=r.token;localStorage.setItem('t',T);start()}catch(e){f.querySelector('#er').textContent=e.message}}}
async function start(){try{me=await api('/me')}catch{T=null;return auth()}
 sock=io({auth:{token:T}});sock.on('msg',m=>{onMsg?onMsg(m):tab=='chats'&&!cur&&home()});sock.on('typing',id=>onTyp&&onTyp(id));
 if(hash&&hash!==me.username){const h=hash;hash='';history.replaceState(null,'',location.pathname);try{const s=await api('/shop/'+h);return openChat(s)}catch{}}home()}
function home(){cur=null;onMsg=onTyp=null;({chats:tChats,status:tStatus,shop:tShop,me:tMe})[tab]()}
async function tChats(){const w=$('<div></div>');const m=shell('💬 चैट',w,1);
 if(me.role!='shop'){const s=$('<div class=card><input id=q placeholder="दुकान का यूज़रनेम"><button class="btn g">दुकान खोलें</button></div>');s.querySelector('button').onclick=async()=>{try{openChat(await api('/shop/'+s.querySelector('#q').value.trim().toLowerCase().replace(/^@/,'')))}catch(e){alert(e.message)}};w.append(s)}
 const l=await api('/chats');if(!l.length)w.append($('<div class="card c mu">अभी कोई चैट नहीं।</div>'));
 l.forEach(c=>{const r=$(`<div class=row><div class=av>${ini(c.name)}</div><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class=mu>${esc(c.last)}</div></div>${c.unread?`<div class=av style="width:22px;height:22px;font-size:12px">${c.unread}</div>`:''}</div>`);r.onclick=()=>openChat(c);w.append(r)})}
async function openChat(o){cur=o;const box=$('<div class=msgs></div>'),isC=me.role!='shop';
 const main=shell(o.name+' · @'+o.username,box,0,()=>home());let typ=$('<div class=mu style="height:16px"></div>');
 if(isC){const[info,fl]=await Promise.all([api('/shop/'+o.username),api('/following')]);let f=fl.some(x=>x.id==o.id);
  const fb=$('<button class="btn s" style="width:100%"></button>'),ob=$('<button class="btn s g" style="width:100%;margin-top:6px">🛒 ऑर्डर करें</button>'),cat=$(`<div class=card>${info.items.map(i=>`<div class=row><div style="flex:1">${esc(i.name)}</div><b>₹${esc(i.price)}</b></div>`).join('')||'<div class=mu>कैटलॉग खाली है</div>'}<div class=mu style="margin-top:6px">👥 ${info.followers} फॉलोअर्स ${info.about?'· '+esc(info.about):''}</div></div>`);
  const set=()=>{fb.textContent=f?'✓ फॉलो कर रहे हैं (हटाएँ)':'➕ फॉलो करें';fb.className='btn s'+(f?' g':'')};set();
  fb.onclick=async()=>{await api('/follow/'+o.id,f?'DELETE':'POST');f=!f;set()};
  ob.onclick=async()=>{const d=prompt('क्या चाहिए? (नाम और मात्रा)');if(d)await api('/orders','POST',{shop:o.id,detail:d})};
  main.prepend(cat);main.prepend(ob);main.prepend(fb)}
 const quick=isC?['नमस्ते','रेट क्या है?','आज डिलीवरी हो जाएगी?']:['नमस्ते! बताइए क्या चाहिए?','ऑर्डर तैयार है ✅','पेमेंट कर दें 🙏'];
 const q=$(`<div class=chips>${quick.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`),bar=$('<div class=bar><button id=at>📎</button><input id=t placeholder="बिज़नेस संदेश"><button id=sd>➤</button><input id=fl type=file hidden></div>');A.append(q,bar);
 const send=(x)=>sock.emit('send',{other:o.id,...x});
 q.onclick=e=>e.target.tagName=='SPAN'&&send({text:e.target.textContent});
 const t=bar.querySelector('#t'),go=()=>{if(t.value.trim()){send({text:t.value.trim()});t.value=''}};
 bar.querySelector('#sd').onclick=go;t.onkeydown=e=>e.key=='Enter'&&go();t.oninput=()=>sock.emit('typing',o.id);
 bar.querySelector('#at').onclick=()=>bar.querySelector('#fl').click();
 bar.querySelector('#fl').onchange=async e=>{try{const u=await upload(e.target.files[0]);send({text:e.target.files[0].name,file:u.url,kind:u.kind})}catch(x){alert(x.message)}};
 const draw=m=>{const mine=m.sender==me.id,att=m.file?(m.kind=='image'?`<img src="${esc(m.file)}">`:m.kind=='video'?`<video src="${esc(m.file)}" controls style="max-width:100%"></video>`:m.kind=='audio'?`<audio src="${esc(m.file)}" controls></audio>`:`<a href="${esc(m.file)}" target=_blank>📄 ${esc(m.text)}</a>`):'';
  const e=$(`<div class="m ${mine?'me':''}">${att}${m.file&&m.kind!='image'&&m.kind!='video'&&m.kind!='audio'?'':esc(m.text)}<div class=mu style="text-align:right">${tm(m.ts)}${mine?' ✓✓':''}</div></div>`);
  const oid=(m.text||'').match(/^🛒 .*#(\d+)/);if(!isC&&oid){const bs=$('<div style="display:flex;gap:4px;margin-top:4px"></div>');['तैयार','भेजा गया','डिलीवर हुआ'].forEach(s=>{const b=$(`<button class="btn s g">${s}</button>`);b.onclick=()=>api('/orders/'+oid[1],'PATCH',{state:s});bs.append(b)});e.append(bs)}
  box.append(e);main.scrollTop=main.scrollHeight};
 (await api('/messages/'+o.id)).forEach(draw);A.querySelector('main').after(typ);
 onMsg=m=>{if(m.shop==o.id||m.cust==o.id)draw(m)};let tt;onTyp=id=>{if(id==o.id){typ.textContent='टाइप कर रहे हैं…';clearTimeout(tt);tt=setTimeout(()=>typ.textContent='',1500)}}}
async function tStatus(){const w=$('<div></div>');shell('🟢 स्टेटस (24 घंटे)',w,1);
 if(me.role=='shop'){const a=$('<div class=card><b>नया स्टेटस</b><input id=t placeholder="ऑफ़र / सूचना"><input id=f type=file accept="image/*,video/*"><button class=btn>पोस्ट करें</button></div>');
  a.querySelector('button').onclick=async()=>{let file='';const fi=a.querySelector('#f').files[0];if(fi)file=(await upload(fi)).url;await api('/status','POST',{text:a.querySelector('#t').value,file});tStatus()};w.append(a)}
 const l=await api('/status');if(!l.length)w.append($('<div class="card c mu">अभी कोई स्टेटस नहीं (दुकानों को फॉलो करें)</div>'));
 l.forEach(x=>w.append($(`<div class=card><div class=row style="border:0;padding:0 0 8px"><div class="av st">${ini(x.name)}</div><div><b>${esc(x.name)}</b><div class=mu>@${esc(x.username)} · ${tm(x.ts)}</div></div></div>${x.file?(/\.(mp4|webm)$/i.test(x.file)?`<video src="${esc(x.file)}" controls style="max-width:100%"></video>`:`<img src="${esc(x.file)}" style="max-width:100%;border-radius:8px">`):''}<div>${esc(x.text)}</div></div>`)))}
async function tShop(){const w=$('<div></div>');shell(me.role=='shop'?'🏪 मेरी दुकान':'⭐ फॉलोइंग',w,1);
 if(me.role!='shop'){const l=await api('/following');if(!l.length)w.append($('<div class="card c mu">कोई दुकान फॉलो नहीं की</div>'));l.forEach(s=>{const r=$(`<div class=row><div class=av>${ini(s.name)}</div><div><b>${esc(s.name)}</b><div class=mu>@${esc(s.username)}</div></div></div>`);r.onclick=()=>openChat(s);w.append(r)});return}
 const link=location.origin+'/#'+me.username;
 const c=$(`<div class="card c"><h3 style="margin:0">${esc(me.name)}</h3><div class=mu>@${esc(me.username)}</div><br><img class=qr src="/qr/${esc(me.username)}.png" width=200><div class=mu style="margin:8px 0">काउंटर पर लगाएँ — ग्राहक स्कैन करके चैट करेंगे</div><button class=btn id=pr>🖨 QR प्रिंट करें</button><button class="btn g" id=cp>लिंक कॉपी करें</button></div>`);
 c.querySelector('#pr').onclick=()=>print();c.querySelector('#cp').onclick=()=>navigator.clipboard?.writeText(link);w.append(c);
 const k=$('<div class=card><b>📦 कैटलॉग में जोड़ें</b><input id=i placeholder="चीज़ का नाम"><input id=pr placeholder="रेट ₹"><button class=btn>जोड़ें</button></div>');
 k.querySelector('button').onclick=async()=>{await api('/items','POST',{name:k.querySelector('#i').value,price:k.querySelector('#pr').value});alert('जुड़ गया')};w.append(k);
 const fs=await api('/followers'),b=$(`<div class=card><b>👥 फॉलोअर्स: ${fs.length}</b><textarea id=b rows=2 placeholder="सभी फॉलोअर्स को ब्रॉडकास्ट"></textarea><button class=btn>📢 सबको भेजें</button></div>`);
 b.querySelector('button').onclick=async()=>{const t=b.querySelector('#b').value.trim();if(t){const r=await api('/broadcast','POST',{text:t});alert(r.sent+' लोगों को भेजा');b.querySelector('#b').value=''}};w.append(b)}
function tMe(){const w=$(`<div class=card><div class=row style="border:0"><div class=av>${ini(me.name)}</div><div><b>${esc(me.name)}</b><div class=mu>@${esc(me.username)} · ${me.role=='shop'?'दुकानदार':'ग्राहक'}</div></div></div><div class=mu>${esc(me.gmail)}<br>${esc(me.phone)}</div><button class="btn g" id=lo>लॉग आउट</button></div>`);shell('👤 प्रोफ़ाइल',w,1);
 w.querySelector('#lo').onclick=()=>{localStorage.removeItem('t');sock?.disconnect();auth()}}
T?start():auth();
</script></body></html>
